<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="WaitLess Hospital Queue OS" />
    <meta
      name="description"
      content="WaitLess Hospital Queue OS for live patient tracking, triage, registration, and queue management."
    />
    <meta name="theme-color" content="#0f766e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <title>WaitLess Hospital Queue OS</title>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #04141f;
        transition: opacity 0.4s ease;
      }
      #app-preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #app-preloader-logo {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        animation: preloader-pulse 1.8s ease-in-out infinite;
      }
      /* WaitLess logo loader — teal cross rotating behind the clock face,
         white checkmark fading in/out over the centre */
      .wl-loader {
        position: relative;
        width: var(--wl-size, 84px);
        height: var(--wl-size, 84px);
        flex-shrink: 0;
      }
      .wl-loader__cross {
        position: absolute;
        inset: -6%;
        animation: wl-cross-spin 3.4s linear infinite;
      }
      .wl-loader__cross::before,
      .wl-loader__cross::after {
        content: "";
        position: absolute;
        background: #26c6b8;
        border-radius: calc(var(--wl-size, 84px) * 0.12);
        box-shadow: 0 0 18px rgba(38, 198, 184, 0.35);
      }
      .wl-loader__cross::before {
        left: 50%;
        top: 0;
        width: 26%;
        height: 100%;
        transform: translateX(-50%);
      }
      .wl-loader__cross::after {
        top: 50%;
        left: 0;
        height: 26%;
        width: 100%;
        transform: translateY(-50%);
      }
      .wl-loader__clock {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        clip-path: circle(33% at 50% 50%);
        z-index: 1;
      }
      .wl-loader__cover {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 34%;
        height: 34%;
        border-radius: 50%;
        background: #0d2434;
        z-index: 2;
      }
      .wl-loader__check {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 30%;
        height: 30%;
        color: #f8fafc;
        z-index: 3;
        animation: wl-check-fade 1.7s ease-in-out infinite;
      }
      @keyframes wl-cross-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes wl-check-fade {
        0%, 100% { opacity: 0.12; transform: scale(0.92); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      #app-preloader-text {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.7; }
      }
    </style>
    <script>
      // Preloader shows on the landing page only — hide instantly elsewhere
      if (window.location.pathname !== "/") {
        document.documentElement.classList.add("skip-preloader");
      }
    </script>
    <style>
      .skip-preloader #app-preloader { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-preloader">
      <div class="wl-loader" style="--wl-size: 84px">
        <span class="wl-loader__cross"></span>
        <img class="wl-loader__clock" src="/waitless-logo-icon.png" alt="WaitLess" />
        <span class="wl-loader__cover"></span>
        <svg class="wl-loader__check" viewBox="0 0 24 24" fill="none">
          <path d="M5.5 13l4.4 4.4L19.5 8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div id="app-preloader-text">WaitLess</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
