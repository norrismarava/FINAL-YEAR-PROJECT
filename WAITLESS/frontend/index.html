<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="WaitLess Hospital Queue OS" />
    <meta
      name="description"
      content="WaitLess Hospital Queue OS for live patient tracking, triage, registration, and queue management."
    />
    <meta name="theme-color" content="#0f766e" />
    <title>WaitLess Hospital Queue OS</title>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #04141f;
        transition: opacity 0.4s ease;
      }
      #app-preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #app-preloader-logo {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        animation: preloader-pulse 1.8s ease-in-out infinite;
      }
      #app-preloader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(45, 212, 191, 0.15);
        border-top-color: #2dd4bf;
        border-radius: 50%;
        animation: preloader-spin 0.8s linear infinite;
      }
      #app-preloader-text {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-preloader">
      <img id="app-preloader-logo" src="/waitless-logo-icon.png" alt="WaitLess" />
      <div id="app-preloader-spinner"></div>
      <div id="app-preloader-text">WaitLess</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
